[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parivahan-contracts"
version = "0.1.0"
description = "Single source of truth Pydantic contracts for Parivahan MVP"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
