[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academy-service"
version = "0.1.0"
description = "Module 4: Driving Academy Assistant with video matching"
requires-python = ">=3.11"
dependencies = [
    "parivahan-contracts",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
parivahan-contracts = { workspace = true }
