[project]
name = "parivahan-gateway"
version = "0.1.0"
description = "Module 5 — Integration Gateway. The only module allowed to talk to Sarathi / Vahan / eChallan."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "parivahan-contracts",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv.sources]
parivahan-contracts = { path = "../../packages/contracts", editable = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: Depends() in defaults is FastAPI's canonical dependency-injection pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
